# Local development dependencies only — the server and web apps run on the host
# (uv run / npm run dev). Production stack lives in deploy/compose.prod.yml.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: wow
      POSTGRES_PASSWORD: wow
      POSTGRES_DB: wow
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wow"]
      interval: 10s
      timeout: 5s
      retries: 20

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    # Artifacts are proxied through the tracking server (--serve-artifacts):
    # clients cannot write to this container's filesystem, so a local
    # --default-artifact-root would silently drop every artifact.
    #
    # 5000 is taken by AirPlay Receiver on macOS, so the host port is 5001 and
    # configurable; inside the network the port is always 5000.
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts --artifacts-destination /mlflow/artifacts
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    volumes:
      - mlflow_data:/mlflow

volumes:
  db_data:
  mlflow_data:
