worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    sendfile on;
    server_tokens off;

    # Cloudflare terminates public TLS; these certs are Cloudflare origin
    # certificates (Full-strict mode). See certs/README.md.
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;

    server {
        listen 80 default_server;
        return 301 https://$host$request_uri;
    }

    # ── app: dashboard + API + voice websocket ────────────────────────────
    server {
        listen 443 ssl;
        server_name wow.anasnadaf.com;

        location /api/ {
            proxy_pass http://server:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Plivo audio stream — long-lived bidirectional websocket
        location /ws/ {
            proxy_pass http://server:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /healthz {
            proxy_pass http://server:8080;
        }

        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ── observability: MLflow ─────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name wowlogs.anasnadaf.com;

        auth_basic "MLflow";
        auth_basic_user_file /etc/nginx/certs/htpasswd;

        location / {
            proxy_pass http://mlflow:5000;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
