name: Deploy

# Runs after images are published from main, and on demand. Tells the host to
# pull the new images over SSM — no SSH port, no manual step.
on:
  workflow_run:
    workflows: ["Docker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # DEPLOY_ENABLED is a repo variable set once the EC2 host exists and AWS
    # secrets are configured — until then the job skips instead of failing.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Pull and restart stack over SSM
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets Key=tag:Name,Values=wow-voice-agent \
            --parameters 'commands=["cd /opt/wow-voice-agent && git pull && cd deploy && docker compose -f compose.prod.yml pull -q && docker compose -f compose.prod.yml up -d"]' \
            --query 'Command.CommandId' --output text)
          echo "command: $CMD_ID"
          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(aws ssm list-commands --command-id "$CMD_ID" \
              --query 'Commands[0].Status' --output text)
            echo "status: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) exit 1 ;;
            esac
          done
          echo "timed out waiting for SSM command"; exit 1

      - name: Verify health
        run: |
          sleep 15
          curl -fsS https://wow.anasnadaf.com/healthz
