[project]
name = "wow-server"
version = "0.1.0"
description = "Outbound voice AI pre-sales agent — Divyasree Whispers of the Wind"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "loguru>=0.7",
    "pipecat-ai[openai,sarvam,silero,soundfile,webrtc,websocket]>=1.7.0",
    "pipecat-ai-small-webrtc-prebuilt>=2.5.0",
    "dspy>=3.3.0",
    "mlflow-skinny>=3.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
